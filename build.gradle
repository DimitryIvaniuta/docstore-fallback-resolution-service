plugins {
    id 'java-library'
}

group = 'com.github.dimitryivaniuta.gateway'
version = '1.1.0'

description = 'Production-grade Docstore fallback resolution with observability, retry hooks, and strict failure semantics.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

test {
    useJUnitPlatform()
}
